services:
  # 1. Express API Web Service
  - type: web
    name: reachinbox-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma migrate deploy --schema=./packages/core/prisma/schema.prisma && npm run build
    startCommand: npm run start --workspace=@email-scheduler/api
    healthCheckPath: /health
    envVars:
      - fromGroup: email-scheduler-shared-env
      - key: PORT
        value: 10000
      - key: API_PUBLIC_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: "none"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_REDIRECT_URI
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true

  # 2. BullMQ Dedicated Background Worker Service
  - type: worker
    name: reachinbox-worker
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start --workspace=@email-scheduler/worker
    envVars:
      - fromGroup: email-scheduler-shared-env

envVarGroups:
  - name: email-scheduler-shared-env
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_INDEX
        value: emails
      - key: MAX_EMAILS_PER_HOUR
        value: "100"
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: "20"
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: MIN_DELAY_MS
        value: "2000"
